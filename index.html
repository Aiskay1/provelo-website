<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provelo Group — Coming Soon</title>
  <meta name="description" content="We're working on a new digital experience that reflects our vision for a more connected world of work, pay and opportunity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hero">
    <header class="hero__header">
      <a href="/" class="hero__logo" aria-label="Provelo Group home">
        <img src="assets/logo.svg" alt="Provelo Group" width="251" height="36">
      </a>
    </header>

    <div class="hero__body">
      <section class="hero__content">
        <span class="hero__square hero__square--tl" aria-hidden="true"></span>
        <span class="hero__square hero__square--tr" aria-hidden="true"></span>
        <span class="hero__square hero__square--bl" aria-hidden="true"></span>
        <span class="hero__square hero__square--br" aria-hidden="true"></span>

        <div class="hero__text">
          <p class="hero__badge">
            <span class="hero__badge-stripe hero__badge-stripe--1" aria-hidden="true"></span>
            <span class="hero__badge-stripe hero__badge-stripe--2" aria-hidden="true"></span>
            <span class="hero__badge-stripe hero__badge-stripe--3" aria-hidden="true"></span>
            <span class="hero__badge-label">OUR NEW WEBSITE IS IN DEVELOPMENT</span>
          </p>
          <h1 class="hero__title">Provelo website is coming soon!</h1>
          <p class="hero__subtitle">We're working on a new digital experience that reflects our vision for a more connected world of work, pay and opportunity.</p>
        </div>

        <form class="hero__form" id="notify-form">
          <label for="notify-email" class="visually-hidden">Email address</label>
          <input id="notify-email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required>
          <button type="submit">Notify me</button>
        </form>
        <p class="hero__form-status" id="notify-status" role="status" aria-live="polite"></p>
      </section>
    </div>

    <!-- "sdf 1": the glass panels from the design, turning together as one wheel -->
    <div class="hero__sdf" aria-hidden="true">
      <span style="--n: 0"></span>
      <span style="--n: 1"></span>
      <span style="--n: 2"></span>
      <span style="--n: 3"></span>
      <span style="--n: 4"></span>
      <span style="--n: 5"></span>
      <span style="--n: 6"></span>
      <span style="--n: 7"></span>
    </div>

    <footer class="hero__footer">
      <p>© 2026 Provelo Group. All rights reserved.</p>
    </footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
